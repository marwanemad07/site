<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>منصة الشروحات</title>
<style>
:root{--side:#0f172a;--bg:#f4f6fb;--card:#fff;--pri:#4f46e5;--txt:#0f172a;--mut:#64748b;--bd:#e5e7eb;--red:#ef4444}
*{box-sizing:border-box;font-family:Tahoma,Arial,sans-serif}
body{margin:0;background:var(--bg);color:var(--txt);display:flex;min-height:100vh}
#side{width:260px;background:var(--side);color:#cbd5e1;display:flex;flex-direction:column;position:fixed;top:0;bottom:0;right:0;overflow:auto}
#side .me{padding:18px;border-bottom:1px solid #1e293b;font-size:14px}
#side .me b{color:#fff;display:block}
#side nav{padding:10px;flex:1}
#side a{display:block;padding:12px 14px;border-radius:10px;cursor:pointer;margin-bottom:4px;font-size:15px}
#side a:hover{background:#1e293b}
#side a.on{background:#1e293b;color:#fff;border:1px solid #334155}
#side .foot{padding:12px;border-top:1px solid #1e293b}
#side input{width:100%;padding:8px;border-radius:8px;border:1px solid #334155;background:#1e293b;color:#fff;margin-bottom:6px}
.out{color:#f87171!important}
main{margin-right:260px;flex:1;padding:24px;max-width:1000px}
.card{background:var(--card);border-radius:14px;border:1px solid var(--bd);padding:18px;margin-bottom:16px}
h2{margin-top:0}
button{background:var(--pri);color:#fff;border:0;border-radius:8px;padding:9px 16px;cursor:pointer;font-size:14px}
button.s{padding:3px 8px;font-size:12px;background:#e2e8f0;color:#334155}
button.r{background:var(--red);color:#fff}
input,textarea{width:100%;padding:10px;border:1px solid var(--bd);border-radius:8px;margin-bottom:8px}
#msgs{height:55vh;overflow:auto;display:flex;flex-direction:column;gap:8px;margin-bottom:10px}
.m{background:#f1f5f9;border-radius:10px;padding:8px 12px}
.m .n{font-weight:bold;font-size:13px;color:var(--pri)}
.m .t{display:flex;gap:4px;margin-top:4px}
.lesson{padding:14px;border:1px solid var(--bd);border-radius:10px;margin-bottom:8px;cursor:pointer}
.lesson:hover{background:#f8fafc}
.ov{position:fixed;inset:0;background:#000c;display:flex;align-items:center;justify-content:center;z-index:9}
.ov .box{background:#fff;border-radius:14px;padding:30px;text-align:center;max-width:420px}
.ad{background:linear-gradient(135deg,#4f46e5,#9333ea);color:#fff;border-radius:12px;padding:40px 20px;margin:14px 0;font-size:20px}
#login{position:fixed;inset:0;background:var(--bg);display:flex;align-items:center;justify-content:center;z-index:20}
#login .card{width:360px;text-align:center}
.hide{display:none!important}
.err{color:var(--red);font-size:13px}
@media(max-width:700px){#side{position:static;width:100%}body{flex-direction:column}main{margin:0}}

/* ===== ثيم أخضر على الطراز الكريمي ===== */
:root{--side:#fbf8ec;--bg:#f7f4e6;--pri:#4f7a3a;--txt:#2f3a2a;--mut:#7a8570;--bd:#e6e1c8}
#side{background:var(--side);color:var(--txt);border-left:1px solid var(--bd);top:64px;z-index:6}
#side .me{border-bottom:1px solid var(--bd)}
#side .me b{color:var(--pri)}
#side a:hover{background:#efeacf}
#side a.on{background:#e9f0e0;color:var(--pri);border:1px solid #cfdcbf}
#side .foot{border-top:1px solid var(--bd)}
#side input{background:#fff;border:1px solid var(--bd);color:var(--txt)}
.out{color:#c0392b!important}
#top{position:fixed;top:0;left:0;right:0;height:64px;background:#fbf8ec;border-bottom:3px solid var(--pri);display:flex;align-items:center;justify-content:space-between;padding:0 18px;z-index:5}
#top h1{margin:0;font-size:22px;color:var(--pri)}
#top small{color:var(--mut);display:block;font-size:11px;font-weight:normal}
#menu{display:none;background:none;color:var(--pri);font-size:28px;padding:0 6px}
main{padding-top:88px}
.m{background:#f3f0de}
.ad{background:linear-gradient(135deg,#4f7a3a,#8aa65a)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:16px}
.tile{background:#fff;border-radius:16px;box-shadow:0 2px 10px #0001;padding:28px 10px;text-align:center;cursor:pointer;color:var(--pri);font-size:18px}
.tile .ic{font-size:46px;display:block;margin-bottom:10px}
.tile:hover{box-shadow:0 4px 16px #0002}
@media(max-width:700px){#menu{display:block}#side{position:fixed;top:64px;bottom:0;width:260px;right:-280px;transition:right .25s}#side.open{right:0}main{margin:0}body{display:block}.grid{grid-template-columns:repeat(2,1fr)}}
.rq{background:#e9f0e0;border-right:3px solid var(--pri);border-radius:6px;padding:4px 8px;margin-bottom:4px;font-size:12px;color:var(--mut);cursor:pointer}
.tm{font-weight:normal;color:var(--mut);font-size:11px;margin-right:6px}
.rb{background:#e9f0e0;border-right:3px solid var(--pri);padding:6px 10px;border-radius:6px;margin-bottom:6px;font-size:13px}
</style>
</head>
<body>

<div id="boot" style="position:fixed;inset:0;background:#f7f4e6;display:flex;align-items:center;justify-content:center;z-index:30;font-size:18px;color:#4f7a3a">جاري التحميل...</div>
<div id="login" class="hide">
 <div class="card">
  <h2>منصة الشروحات</h2>
  <div id="step1"><p>سجّل دخولك بحساب جوجل</p><button onclick="loginG()">الدخول بجيميل</button></div>
  <div id="step2" class="hide">
   <p>اختر اسمك (حروف فقط، بدون رموز أو أرقام)</p>
   <input id="nm" maxlength="20" placeholder="اسمك">
   <button onclick="saveName()">حفظ ودخول</button>
  </div>
  <p class="err" id="lerr"></p>
 </div>
</div>

<header id="top"><h1>منصة الشروحات<small>شروحات ونقاش وفكر</small></h1><button id="menu">☰</button></header>

<aside id="side" class="hide">
 <div class="me"><b id="meName"></b><span id="meRole"></span></div>
 <nav id="nav"></nav>
 <div class="foot">
  <input id="code" placeholder="كود الأدمن">
  <button onclick="useCode()" style="width:100%">تفعيل</button>
  <a class="out" onclick="logout()" style="margin-top:8px">تسجيل الخروج</a>
 </div>
</aside>

<main id="main" class="hide"></main>

<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import {getAuth,GoogleAuthProvider,signInWithPopup,signInWithRedirect,onAuthStateChanged,signOut,setPersistence,browserLocalPersistence} from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
import {getFirestore,doc,getDoc,setDoc,deleteDoc,addDoc,collection,query,orderBy,limit,where,onSnapshot,getDocs,serverTimestamp} from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

/* ====== ضع إعدادات Firebase بتاعتك هنا ====== */
const firebaseConfig={apiKey:"AIzaSyBk-KXQJ-Wuflr-2ZQsxaFN9jEQfXmlClc",authDomain:"share-f150c.firebaseapp.com",projectId:"share-f150c",storageBucket:"share-f150c.firebasestorage.app",messagingSenderId:"861894276415",appId:"1:861894276415:web:1e653659b2b6d10e1f4f8a"};
/* هاش SHA-256 لكود الأدمن (كود الأدمن: lkgyud1) */
const ADMIN_HASH="1bcd12a87c7a67e13dcaad47519263926eeaca2e822efb67a28282b6d2f53ecd";
const OWNER_HASH="d1f14c1d56a3c20c2aa77ac2a28e514f3a3ed8499dd282934e352fe073e55047";
/* ============================================ */

const app=initializeApp(firebaseConfig),auth=getAuth(app),db=getFirestore(app);
setPersistence(auth,browserLocalPersistence).catch(()=>{});
const SECTIONS={home:"🏠 الرئيسية",chat:"💬 الشات",logic:"شروحات منطق",physics:"شروحات فيزياء",philo:"شروحات فلسفة",religion:"شروحات دين",critique:"نقود لأفكار خاطئة",apply:"التقديم على الإدارة",bans:"المحظورون",admins:"إدارة الأدمن"};
let user=null,profile=null,unsub=null,cur="home";
const SUBS={religion:{aqeeda:["العقيدة","☝️"],fiqh:["الفقه","⚖️"],tafsir:["التفسير","📖"],hadith:["الحديث","📜"],seerah:["السيرة","🌙"]}};
const secTitle=c=>{const[p,k]=c.split(":");return k&&SUBS[p]&&SUBS[p][k]?SECTIONS[p].replace(/^[^\p{L}]+/u,"")+" ‹ "+SUBS[p][k][0]:SECTIONS[c]};
const backBtn=c=>c.includes(":")?`<button class="s" id="bk">← رجوع</button> `:"";
const ICONS={chat:"💬",logic:"🧠",physics:"⚛️",philo:"📚",religion:"🕌",critique:"🔎",apply:"📝",bans:"🚫",admins:"👑"};
const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const isAdmin=()=>profile&&profile.admin;
const vis=k=>(k!=="bans"||isAdmin())&&(k!=="admins"||(profile&&profile.owner));
$("menu").onclick=()=>$("side").classList.toggle("open");
const shown=p=>p.name+(p.owner?" [owner]":p.admin?" [admin]":"");

let busy=false;
window.loginG=async()=>{
 if(busy)return;busy=true;
 const b=document.querySelector("#step1 button");b.disabled=true;$("lerr").textContent="";
 const p=new GoogleAuthProvider(),mobile=/Android|iPhone|iPad|Mobile/i.test(navigator.userAgent);
 try{
  if(mobile){await signInWithRedirect(auth,p);return}
  await signInWithPopup(auth,p);
 }catch(e){
  if(["auth/cancelled-popup-request","auth/popup-blocked","auth/popup-closed-by-user"].includes(e.code)){
   try{await signInWithRedirect(auth,p);return}catch(e2){e=e2}
  }
  $("lerr").textContent="فشل تسجيل الدخول: "+(e.code||e.message);
 }
 busy=false;b.disabled=false;
};
window.logout=()=>signOut(auth);

onAuthStateChanged(auth,async u=>{
 $("boot").classList.add("hide");
 user=u;
 if(!u){profile=null;$("login").classList.remove("hide");["side","main"].forEach(i=>$(i).classList.add("hide"));$("step1").classList.remove("hide");$("step2").classList.add("hide");return}
 const ban=await getDoc(doc(db,"bans",u.uid));
 const p=await getDoc(doc(db,"users",u.uid));
 if(ban.exists()&&!(p.exists()&&p.data().owner)){$("lerr").textContent="هذا الحساب محظور من الموقع";return signOut(auth)}
 if(!p.exists()){$("step1").classList.add("hide");$("step2").classList.remove("hide");$("login").classList.remove("hide");return}
 profile=p.data();start();
});

window.saveName=async()=>{
 const n=$("nm").value.trim();
 if(!/^[\p{L}]+(\s[\p{L}]+)*$/u.test(n)||n.length<2){$("lerr").textContent="الاسم لازم حروف فقط بدون رموز أو أرقام";return}
 const k=n.toLowerCase().replace(/\s+/g,"_");
 const ex=await getDoc(doc(db,"names",k));
 if(ex.exists()&&ex.data().uid!==user.uid){$("lerr").textContent="الاسم مستخدم";return}
 await setDoc(doc(db,"names",k),{uid:user.uid});
 profile={name:n,admin:false};
 await setDoc(doc(db,"users",user.uid),profile);
 $("lerr").textContent="";start();
};

async function sha(s){const b=await crypto.subtle.digest("SHA-256",new TextEncoder().encode(s));return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,"0")).join("")}
window.useCode=async()=>{
 const h=await sha($("code").value.trim());
 if(h===OWNER_HASH){profile.owner=true;profile.admin=true}
 else if(h===ADMIN_HASH){profile.admin=true}
 else return alert("الكود غلط");
 await setDoc(doc(db,"users",user.uid),profile);$("code").value="";start();
};

function start(){
 $("side").classList.remove("open");
 $("login").classList.add("hide");$("side").classList.remove("hide");$("main").classList.remove("hide");
 $("meName").textContent=shown(profile);$("meRole").textContent=profile.owner?"مالك الموقع":isAdmin()?"إدارة":"عضو";
 $("nav").innerHTML=Object.entries(SECTIONS).filter(([k])=>vis(k)).map(([k,v])=>`<a data-k="${k}" class="${k===cur||cur.startsWith(k+":")?"on":""}">${v}</a>`).join("");
 $("nav").querySelectorAll("a").forEach(a=>a.onclick=()=>{cur=a.dataset.k;start()});
 render();
}

function render(){
 if(unsub){unsub();unsub=null}
 if(cur==="home")return homeView();
 if(SUBS[cur])return subView();
 if(cur==="admins")return adminsView();
 if(cur==="chat")return chatView();
 if(cur==="apply")return applyView();
 if(cur==="bans")return bansView();
 lessonsView();
}

/* ===== الأقسام الفرعية ===== */
function subView(){
 $("main").innerHTML=`<button class="s" id="bk">← الرئيسية</button><h2>${SECTIONS[cur].replace(/^[^\p{L}]+/u,"")}</h2><div class="grid">`+Object.entries(SUBS[cur]).map(([k,v])=>`<div class="tile" data-k="${cur}:${k}"><span class="ic">${v[1]}</span>${v[0]}</div>`).join("")+`</div>`;
 $("bk").onclick=()=>{cur="home";start()};
 $("main").querySelectorAll(".tile").forEach(t=>t.onclick=()=>{cur=t.dataset.k;start()});
}

/* ===== الرئيسية ===== */
function homeView(){
 $("main").innerHTML=`<h2>مرحبًا ${esc(profile.name)} 👋</h2><div class="grid">`+Object.keys(SECTIONS).filter(k=>k!=="home"&&vis(k)).map(k=>`<div class="tile" data-k="${k}"><span class="ic">${ICONS[k]}</span>${SECTIONS[k].replace(/^[^\p{L}]+/u,"")}</div>`).join("")+`</div>`;
 $("main").querySelectorAll(".tile").forEach(t=>t.onclick=()=>{cur=t.dataset.k;start()});
}

/* ===== إدارة الأدمن (للمالك فقط) ===== */
async function adminsView(){
 if(!profile.owner)return;
 $("main").innerHTML=`<div class="card"><h2>إدارة الأدمن</h2><div id="adl">جاري التحميل...</div></div>`;
 const s=await getDocs(query(collection(db,"users"),where("admin","==",true)));
 $("adl").innerHTML=s.docs.map(d=>{const u=d.data();return `<div class="lesson" style="cursor:default">${esc(u.name)} ${u.owner?"<small>(مالك الموقع)</small>":`<button class="s r" data-id="${d.id}" style="float:left">إزالة الأدمن</button>`}</div>`}).join("")||"لا يوجد أدمن";
 $("adl").querySelectorAll("button").forEach(b=>b.onclick=async()=>{
  if(!confirm("إزالة صلاحية الأدمن عن هذا الشخص؟"))return;
  await setDoc(doc(db,"users",b.dataset.id),{admin:false},{merge:true});adminsView();
 });
}

/* ===== الشات ===== */
let replyTo=null;
const fmtTime=t=>{const d=(t&&t.toDate)?t.toDate():new Date(),n=new Date();const tm=d.toLocaleTimeString("ar-EG",{hour:"numeric",minute:"2-digit"});return d.toDateString()===n.toDateString()?tm:d.toLocaleDateString("ar-EG",{day:"numeric",month:"numeric"})+" "+tm};
function showRb(){const rb=$("rb");if(!rb)return;if(!replyTo){rb.classList.add("hide");return}rb.classList.remove("hide");rb.innerHTML=`رد على <b>${esc(replyTo.name)}</b>: ${esc(replyTo.text.slice(0,60))} <button class="s" id="rx">✕ إلغاء</button>`;$("rx").onclick=()=>{replyTo=null;showRb()}}
function chatView(){
 replyTo=null;
 $("main").innerHTML=`<div class="card"><h2>الشات العام</h2><div id="msgs"></div>
 <div id="rb" class="rb hide"></div>
 <div style="display:flex;gap:8px"><input id="mi" placeholder="اكتب رسالتك..." style="margin:0"><button id="ms">إرسال</button></div><p class="err" id="ce"></p></div>`;
 $("ms").onclick=send;$("mi").onkeydown=e=>{if(e.key==="Enter")send()};
 unsub=onSnapshot(query(collection(db,"messages"),orderBy("createdAt","desc"),limit(100)),s=>{
  const box=$("msgs");if(!box)return;
  const byId={};
  box.innerHTML=s.docs.reverse().map(d=>{const m=d.data({serverTimestamps:"estimate"});byId[d.id]={id:d.id,name:m.name,text:m.text};
   const own=m.uid===user.uid;
   const tools=!isAdmin()?"":((m.owner&&!own)||(m.admin&&!own&&!profile.owner))?"":own?`<div class="t"><button class="s r" data-a="del" data-id="${d.id}">حذف</button></div>`:`<div class="t"><button class="s r" data-a="del" data-id="${d.id}">حذف</button><button class="s" data-a="to" data-u="${m.uid}">تايم أوت 10د</button><button class="s" data-a="un" data-u="${m.uid}">إزالة التايم أوت</button><button class="s r" data-a="ban" data-u="${m.uid}">تبنيد</button><button class="s" data-a="unban" data-u="${m.uid}">فك التبنيد</button>${profile.owner&&m.admin?`<button class="s r" data-a="rm" data-u="${m.uid}">إزالة الأدمن</button>`:""}</div>`;
   const rq=m.reply?`<div class="rq" data-go="${esc(m.reply.id||"")}"><b>${esc(m.reply.name)}</b>: ${esc(m.reply.text)}</div>`:"";
   return `<div class="m" id="msg_${d.id}">${rq}<div class="n">${esc(m.name)} <span class="tm">${fmtTime(m.createdAt)}</span></div>${esc(m.text)}<div class="t"><button class="s" data-r="${d.id}">↩ رد</button></div>${tools}</div>`}).join("");
  box.scrollTop=box.scrollHeight;
  box.querySelectorAll("button").forEach(b=>b.onclick=()=>{
   if(b.dataset.r){replyTo=byId[b.dataset.r];showRb();$("mi").focus()}else adminAct(b.dataset)});
  box.querySelectorAll(".rq").forEach(q=>q.onclick=()=>{const t=document.getElementById("msg_"+q.dataset.go);if(t){t.scrollIntoView({behavior:"smooth",block:"center"});t.style.outline="2px solid var(--pri)";setTimeout(()=>{t.style.outline=""},1500)}});
 });
}
async function send(){
 const t=$("mi").value.trim();if(!t)return;
 const to=await getDoc(doc(db,"timeouts",user.uid));
 if(!profile.owner&&to.exists()&&to.data().until>Date.now()){$("ce").textContent="أنت في تايم أوت لمدة "+Math.ceil((to.data().until-Date.now())/60000)+" دقيقة";return}
 $("ce").textContent="";$("mi").value="";
 await addDoc(collection(db,"messages"),{uid:user.uid,name:shown(profile),owner:!!profile.owner,admin:!!profile.admin,text:t.slice(0,500),reply:replyTo?{id:replyTo.id,name:replyTo.name,text:replyTo.text.slice(0,80)}:null,createdAt:serverTimestamp()});
 replyTo=null;showRb();
}
async function adminAct(d){
 if(!isAdmin())return;
 if(d.u){const t=await getDoc(doc(db,"users",d.u));if(t.exists()){const x=t.data();if(x.owner)return alert("لا يمكن تنفيذ هذا الإجراء على مالك الموقع");if(x.admin&&!profile.owner)return alert("هذا الإجراء على الأدمن للمالك فقط")}}
 if(d.a==="del")await deleteDoc(doc(db,"messages",d.id));
 if(d.a==="to"){await setDoc(doc(db,"timeouts",d.u),{until:Date.now()+600000});alert("تم إعطاء تايم أوت 10 دقائق")}
 if(d.a==="un"){await deleteDoc(doc(db,"timeouts",d.u));alert("تمت إزالة التايم أوت")}
 if(d.a==="rm"&&profile.owner&&confirm("إزالة صلاحية الأدمن عن هذا الشخص؟")){await setDoc(doc(db,"users",d.u),{admin:false},{merge:true});alert("تمت إزالة الأدمن")}
 if(d.a==="unban"){await deleteDoc(doc(db,"bans",d.u));alert("تم فك التبنيد")}
 if(d.a==="ban"&&confirm("تبنيد هذا الشخص نهائيًا؟"))await setDoc(doc(db,"bans",d.u),{by:user.uid});
}

/* ===== الدروس ===== */
function lessonsView(){
 $("main").innerHTML=`<div class="card">${backBtn(cur)}<h2>${secTitle(cur)}</h2><div id="ls">جاري التحميل...</div></div>
 ${isAdmin()?`<div class="card"><h3>إضافة درس</h3><input id="lt" placeholder="اسم الدرس"><textarea id="lc" rows="6" placeholder="محتوى الدرس"></textarea><button id="la">إضافة</button></div>`:""}`;
 if($("bk"))$("bk").onclick=()=>{cur=cur.split(":")[0];start()};
 if(isAdmin())$("la").onclick=async()=>{
  const t=$("lt").value.trim(),c=$("lc").value.trim();if(!t||!c)return;
  await addDoc(collection(db,"lessons"),{section:cur,title:t,content:c,createdAt:Date.now()});
  $("lt").value=$("lc").value="";
 };
 unsub=onSnapshot(query(collection(db,"lessons"),where("section","==",cur)),s=>{
  const ds=s.docs.sort((a,b)=>a.data().createdAt-b.data().createdAt);
  $("ls").innerHTML=ds.length?ds.map((d,i)=>`<div class="lesson" data-id="${d.id}"><b>الدرس ${i+1}:</b> ${esc(d.data().title)}${isAdmin()?` <button class="s r" data-del="${d.id}" style="float:left">حذف</button>`:""}</div>`).join(""):"لا توجد دروس بعد";
  $("ls").querySelectorAll(".lesson").forEach(el=>el.onclick=e=>{
   if(e.target.dataset.del){deleteDoc(doc(db,"lessons",e.target.dataset.del));return}
   openLesson(ds.find(d=>d.id===el.dataset.id).data());
  });
 });
}
function openLesson(l){
 const ov=document.createElement("div");ov.className="ov";
 document.body.appendChild(ov);
 const show=()=>{ov.innerHTML=`<div class="box" style="max-width:700px;text-align:right;max-height:85vh;overflow:auto"><h2>${esc(l.title)}</h2><div style="white-space:pre-wrap;line-height:1.9">${esc(l.content)}</div><br><button id="cl">إغلاق</button></div>`;ov.querySelector("#cl").onclick=()=>ov.remove()};
 if(isAdmin()){show();return}
 ov.innerHTML=`<div class="box"><h3>إعلان</h3><div class="ad">مساحة إعلانية<br>الدرس يبدأ بعد <span id="cd">15</span> ثانية</div><small>الإعلان يدعم فريق العمل 💙</small></div>`;
 let s=15;const iv=setInterval(()=>{s--;ov.querySelector("#cd").textContent=s;if(s<=0){clearInterval(iv);show()}},1000);
}

/* ===== المحظورون ===== */
async function bansView(){
 if(!isAdmin())return;
 $("main").innerHTML=`<div class="card"><h2>المحظورون</h2><div id="bl">جاري التحميل...</div></div>`;
 const s=await getDocs(collection(db,"bans"));
 const rows=await Promise.all(s.docs.map(async d=>{const u=await getDoc(doc(db,"users",d.id));return {id:d.id,name:u.exists()?u.data().name:d.id}}));
 $("bl").innerHTML=rows.length?rows.map(r=>`<div class="lesson" style="cursor:default">${esc(r.name)} <button class="s" data-id="${r.id}" style="float:left">فك الحظر</button></div>`).join(""):"لا يوجد محظورون";
 $("bl").querySelectorAll("button").forEach(b=>b.onclick=async()=>{await deleteDoc(doc(db,"bans",b.dataset.id));bansView()});
}

/* ===== التقديم على الإدارة ===== */
async function applyView(){
 const qd=await getDoc(doc(db,"config","questions"));
 const Q=qd.exists()?qd.data().list:[];
 const mine=await getDoc(doc(db,"applications",user.uid));
 const ST={pending:"قيد المراجعة ⏳",accepted:"مقبول ✅",rejected:"مرفوض ❌"};
 let h=`<div class="card"><h2>التقديم على الإدارة</h2>`;
 if(mine.exists()){const a=mine.data();h+=`<p><b>حالة طلبك:</b> ${ST[a.status]}</p>${a.reply?`<div class="m"><div class="n">رد الإدارة</div>${esc(a.reply)}</div><br>`:""}`}
 if(!Q.length)h+=`<p>لا توجد أسئلة حالياً، حاول لاحقاً.</p>`;
 else h+=`<p>أجب عن الأسئلة التالية:</p>`+Q.map((q,i)=>`<p><b>${i+1}. ${esc(q)}</b></p><textarea class="qa" rows="3"></textarea>`).join("")+`<button id="as">${mine.exists()?"إعادة الإرسال":"إرسال الطلب"}</button><p class="err" id="ae"></p>`;
 h+=`</div>`;
 if(isAdmin())h+=`<div class="card"><h3>أسئلة التقديم (سؤال في كل سطر)</h3><textarea id="qe" rows="6">${esc(Q.join("\n"))}</textarea><button id="qs">حفظ الأسئلة</button></div><div class="card"><h3>الطلبات المقدمة</h3><div id="al">...</div></div>`;
 $("main").innerHTML=h;
 if($("as"))$("as").onclick=async()=>{
  const as=[...document.querySelectorAll(".qa")].map(t=>t.value.trim());
  if(as.some(a=>!a)){$("ae").textContent="جاوب على كل الأسئلة";return}
  await setDoc(doc(db,"applications",user.uid),{uid:user.uid,name:profile.name,answers:Q.map((q,i)=>({q,a:as[i]})),status:"pending",reply:"",createdAt:Date.now()});
  applyView();
 };
 if(!isAdmin())return;
 $("qs").onclick=async()=>{await setDoc(doc(db,"config","questions"),{list:$("qe").value.split("\n").map(s=>s.trim()).filter(Boolean)});applyView()};
 const s=await getDocs(collection(db,"applications"));
 $("al").innerHTML=s.docs.map(d=>{const a=d.data();return `<div class="m" style="margin-bottom:10px"><div class="n">${esc(a.name)} — ${ST[a.status]}</div>${(a.answers||[]).map(x=>`<p><b>${esc(x.q)}</b><br>${esc(x.a)}</p>`).join("")}<textarea id="r_${d.id}" rows="2" placeholder="اكتب ردك للمتقدم (مثلاً الكود أو سبب الرفض)">${esc(a.reply||"")}</textarea><button class="s" data-id="${d.id}" data-st="accepted">قبول</button> <button class="s r" data-id="${d.id}" data-st="rejected">رفض</button></div>`}).join("")||"لا توجد طلبات";
 $("al").querySelectorAll("button").forEach(b=>b.onclick=async()=>{
  await setDoc(doc(db,"applications",b.dataset.id),{status:b.dataset.st,reply:$("r_"+b.dataset.id).value.trim()},{merge:true});applyView();
 });
}
</script>
</body>
</html>
